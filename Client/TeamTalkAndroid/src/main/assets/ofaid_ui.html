<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFAID UI — Ruang Ngopi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f0f1a; color: #e2e8f0; min-height: 100vh; max-width: 420px; margin: 0 auto; padding: 16px; padding-bottom: 90px; overflow-x: hidden; }
        
        /* Header Layout */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; }
        .channel-id { font-size: 13px; color: #6366f1; background: rgba(99, 102, 241, 0.15); padding: 6px 12px; border-radius: 16px; z-index: 2; }
        .online-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #22c55e; z-index: 2; }
        .online-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 6px #22c55e; animation: pulse 2s infinite; }

        /* AREA HEADER DINAMIS (Tengah) */
        .dynamic-header-area {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
        }

        /* Logo Statis (Default saat OFF) */
        .app-logo-static {
            width: 48px; height: 48px; background: #33b5e5; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; font-size: 20px;
            transition: all 0.3s ease; opacity: 1; transform: scale(1);
        }

        /* Avatar User TX (Muncul saat ON) */
        .user-tx-avatar {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
            border: 3px solid #4ade80; box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
            position: absolute; opacity: 0; transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* State Aktif: Logo Hilang, Avatar Muncul */
        .dynamic-header-area.is-transmitting .app-logo-static { opacity: 0; transform: scale(0.5); }
        .dynamic-header-area.is-transmitting .user-tx-avatar { opacity: 1; transform: scale(1); }

        /* Host Section */
        .host-section { text-align: center; padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 20px; }
        .host-avatar-wrap { position: relative; display: inline-block; margin-bottom: 14px; }
        .host-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid transparent; background: linear-gradient(#0f0f1a, #0f0f1a) padding-box, linear-gradient(135deg, #f59e0b, #ec4899) border-box; }
        .host-status { position: absolute; bottom: 6px; right: 6px; width: 18px; height: 18px; background: #22c55e; border-radius: 50%; border: 3px solid #0f0f1a; }
        .host-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .host-mood { font-size: 13px; color: #9ca3af; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
        .stat-box { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        .stat-val { font-size: 15px; font-weight: 700; }
        .stat-val.green { color: #4ade80; } .stat-val.yellow { color: #facc15; } .stat-val.purple { color: #a78bfa; }
        .stat-lab { font-size: 10px; color: #6b7280; margin-top: 4px; }

        /* User List */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .list-title { font-size: 15px; font-weight: 600; } .list-count { font-size: 12px; color: #6b7280; }
        .user-list { display: flex; flex-direction: column; gap: 8px; }
        .user-card { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.02); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.04); transition: 0.2s; }
        .user-card:active { background: rgba(255,255,255,0.06); transform: scale(0.98); }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #334155; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .user-avatar.admin { border: 2px solid #f59e0b; }
        .user-info { flex: 1; }
        .user-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .user-location { font-size: 11px; color: #6b7280; margin-top: 2px; }
        .channel-tag { font-size: 10px; color: #818cf8; background: rgba(99, 102, 241, 0.1); padding: 4px 8px; border-radius: 8px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: rgba(15, 15, 26, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; padding: 10px 0 20px; border-top: 1px solid rgba(255,255,255,0.06); z-index: 100; }
        .nav-btn { font-size: 20px; opacity: 0.4; cursor: pointer; }
        .nav-btn.active { opacity: 1; }
        
        /* Tombol PTT OFAID */
        .ptt-main { 
            width: 64px; height: 64px; border-radius: 50%; 
            background: linear-gradient(135deg, #f59e0b, #ef4444); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 28px; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); 
            margin-top: -30px; border: 4px solid #0f0f1a; transition: transform 0.1s;
        }
        .ptt-main:active { transform: scale(0.9); box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Header dengan Dynamic Swap -->
    <div class="header">
        <span class="channel-id" id="ui-chan-id">CH ---</span>
        
        <!-- Area Tengah yang Berubah -->
        <div class="dynamic-header-area" id="ui-dynamic-header">
            <div class="app-logo-static">OF</div>
            <img class="user-tx-avatar" id="ui-tx-avatar" src="" alt="TX">
        </div>

        <div class="online-indicator">
            <span class="online-dot"></span>
            <span id="ui-status">Online</span>
        </div>
    </div>

    <!-- Host / Diri Sendiri -->
    <div class="host-section">
        <div class="host-avatar-wrap">
            <img class="host-avatar" id="ui-host-avatar" src="https://ui-avatars.com/api/?name=OFAID&background=f59e0b&color=fff" alt="Host">
            <span class="host-status"></span>
        </div>
        <h2 class="host-name" id="ui-my-name">Pengembang OFAID</h2>
        <p class="host-mood" id="ui-my-loc">📍 Mendeteksi lokasi...</p>
    </div>

    <!-- Statistik Koneksi -->
    <div class="stats-grid">
        <div class="stat-box"><div class="stat-val green">●</div><div class="stat-lab">Status</div></div>
        <div class="stat-box"><div class="stat-val purple" id="ui-tx">0</div><div class="stat-lab">Tx KB/s</div></div>
        <div class="stat-box"><div class="stat-val purple" id="ui-rx">0</div><div class="stat-lab">Rx KB/s</div></div>
        <div class="stat-box"><div class="stat-val yellow" id="ui-ping">--</div><div class="stat-lab">Ping ms</div></div>
    </div>

    <!-- Daftar User -->
    <div class="list-header">
        <span class="list-title">👥 Anggota Channel</span>
        <span class="list-count" id="ui-user-count">0 orang</span>
    </div>
    <div class="user-list" id="ui-user-list"></div>

    <!-- Navigasi Bawah -->
    <div class="bottom-nav">
        <span class="nav-btn">📊</span>
        <span class="nav-btn">👥</span>
        <div class="ptt-main" onclick="handlePtt()">🎙️</div>
        <span class="nav-btn">💬</span>
        <span class="nav-btn">⚙️</span>
    </div>

    <script>
        function handlePtt() {
            const btn = document.querySelector('.ptt-main');
            btn.style.transform = 'scale(0.85)';
            setTimeout(() => btn.style.transform = 'scale(1)', 150);
            if (typeof AndroidBridge !== 'undefined') AndroidBridge.triggerPtt();
        }

        function refreshData() {
            if (typeof AndroidBridge !== 'undefined') {
                try {
                    // 1. Cek Status TX & Update Header
                    const isTx = AndroidBridge.isVoiceTransmitting();
                    const headerArea = document.getElementById('ui-dynamic-header');
                    if (isTx) headerArea.classList.add('is-transmitting');
                    else headerArea.classList.remove('is-transmitting');

                    // 2. Ambil Data Bridge
                    const rawData = AndroidBridge.getBridgeData();
                    const data = JSON.parse(rawData);
                    
                    // Update URL Avatar TX
                    const txAvatarImg = document.getElementById('ui-tx-avatar');
                    if (data.myAvatarUrl && txAvatarImg.src !== data.myAvatarUrl) {
                        txAvatarImg.src = data.myAvatarUrl;
                    }

                    // Update Teks & Stats
                    if(data.channelName) document.getElementById('ui-chan-name').innerText = data.channelName;
                    if(data.channelId) document.getElementById('ui-chan-id').innerText = data.channelId;
                    if(data.myLocation) document.getElementById('ui-my-loc').innerText = '📍 ' + data.myLocation;
                    if(data.ping !== undefined) document.getElementById('ui-ping').innerText = data.ping;
                    if(data.txKbs !== undefined) document.getElementById('ui-tx').innerText = data.txKbs;
                    if(data.rxKbs !== undefined) document.getElementById('ui-rx').innerText = data.rxKbs;
                    
                    // Render User List
                    const listContainer = document.getElementById('ui-user-list');
                    if(data.users && Array.isArray(data.users) && data.users.length > 0) {
                        document.getElementById('ui-user-count').innerText = data.users.length + ' orang';
                        let html = '';
                        data.users.forEach(u => {
                            const initial = u.name ? u.name.substring(0,2).toUpperCase() : '??';
                            html += `<div class="user-card">
                                <div class="user-avatar ${u.isAdmin ? 'admin' : ''}">${initial}</div>
                                <div class="user-info">
                                    <div class="user-name">${u.name || 'Unknown'} ${u.isAdmin ? '<span class="role-badge">HOST</span>' : ''}</div>
                                    <div class="user-location">📍 ${u.location || 'Lokasi Privat'}</div>
                                </div>
                                <span class="channel-tag">${u.chanTag || 'CH ???'}</span>
                            </div>`;
                        });
                        listContainer.innerHTML = html;
                    } else {
                        document.getElementById('ui-user-count').innerText = '0 orang';
                        listContainer.innerHTML = '';
                    }
                } catch(e) { console.log("Waiting for bridge..."); }
            }
        }

        // Refresh setiap 300ms agar swap avatar terasa instan
        setInterval(refreshData, 300);
        refreshData();
    </script>
</body>
</html>
